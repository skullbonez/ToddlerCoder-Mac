name: Build Mac App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app bundle
        run: bash scripts/build-mac-app.sh

      - name: Upload app zip
        uses: actions/upload-artifact@v4
        with:
          name: ToddlerCoder-Mac
          path: dist/ToddlerCoder-Mac.zip
